<style>
  /* Manrope servito da qui, non da una CDN: la pagina non fa nessuna
     richiesta fuori da questo repository. */
  @font-face {
    font-family: Manrope; font-style: normal; font-weight: 400;
    src: url(font/Manrope-400.ttf) format("truetype"); font-display: swap;
  }
  @font-face {
    font-family: Manrope; font-style: normal; font-weight: 800;
    src: url(font/Manrope-800.ttf) format("truetype"); font-display: swap;
  }

  :root {
    --navy: #0F1A33;
    --verde: #22C55E;
    --tenue: #A8B3C4;
    --segno: 68px;          /* altezza del marchio */
    --badge: 52px;          /* altezza del DISEGNO dei badge */
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; max-width: 100%; }

  body {
    background: var(--navy);
    color: #fff;
    font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── marchio e nome ──────────────────────────────────────────
     Impilati e centrati. La misura la lega l'altezza delle
     maiuscole: Manrope ha cap height 0,72 em, e il marchio e' alto
     il doppio di quelle, quindi corpo = segno / (2 x 0,72). */
  .firma { display: flex; flex-direction: column; align-items: center; }
  .segno {
    height: var(--segno);
    width: calc(var(--segno) * 1.24609375);     /* 638/512, l'ingombro vero */
    display: block;
  }
  h1 {
    font-size: calc(var(--segno) / 1.44);
    font-weight: 800;
    letter-spacing: -0.0167em;
    line-height: 1;
    margin: calc(var(--segno) * 0.24) 0 0;
  }

  .claim {
    color: var(--verde);
    font-size: 17px;
    line-height: 1.4;
    margin: 18px 0 0;
    max-width: 22em;
  }

  /* ── i badge ─────────────────────────────────────────────────
     Sono marchi registrati, presi dai kit ufficiali e non ritoccati.

     Le due tele non hanno le stesse proporzioni: l'SVG di Apple e'
     tutto disegno (119,664 x 40), il PNG di Google e' 646 x 250 con
     29 px di aria sopra e sotto gia' dentro il file, quindi il
     disegno e' 646 x 192. Dando la stessa altezza ai due file, il
     badge di Google uscirebbe piu' piccolo del 23%: si misura il
     disegno, non la tela.

     Gli spazi di rispetto: Apple chiede il 10% dell'altezza del
     badge su ogni lato (5,2 px), Google un quarto (13 px). Il vuoto
     fra i due e almeno il margine della pagina non scendono mai
     sotto i 24, quindi tutt'e due sono rispettati con margine. */
  .store {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    margin-top: 40px;
  }
  .store a { display: block; line-height: 0; }
  .store img { display: block; max-width: 100%; height: auto; }
  .store .apple { height: var(--badge); }
  .store .play { height: calc(var(--badge) * 250 / 192); }

  @media (min-width: 560px) {
    :root { --segno: 84px; }
    .store { flex-direction: row; justify-content: center; gap: 28px; }
    .claim { font-size: 19px; }
  }

  footer {
    margin-top: 56px;
    font-size: 13px;
    color: var(--tenue);
  }
  footer a { color: var(--tenue); }
  footer span { margin: 0 8px; opacity: .5; }
</style>
